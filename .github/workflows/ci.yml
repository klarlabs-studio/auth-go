name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    # No paths-ignore here: branch protection requires this workflow's status
    # checks (ci / Lint, Test, Build, Security (nox)), and a docs-only PR that
    # skips the whole workflow never reports them — so the PR is unmergeable
    # forever without an admin override. Running CI on docs PRs is cheap (no
    # code changed → cache hits) and keeps them mergeable; the push trigger
    # above still skips docs, saving minutes on merges.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      cross-platform: false   # pure-logic lib; ubuntu is sufficient
      nox-strict: true        # repo is clean of high/critical — enforce, don't just report
      # nox-version deliberately NOT pinned here: inherit the shared go-ci
      # default, so the scanner and this repo's committed baseline stay on the
      # same fingerprint algorithm.
      #
      # The old "1.2.0" pin was a workaround for a v1.1.x cosign bug — it could
      # not verify the taint plugin's ".sigstore.json" bundle — fixed in v1.1.2.
      # Its own comment named the durable fix ("bump the shared go-ci default"),
      # which has since happened; the pin was what remained.
      #
      # It mattered because nox v1.3.0 changed the baseline fingerprint to
      # sha256(rule‖normalised_path‖content). .nox/baseline.json here is already
      # v2 and a 1.2.0 scanner computes v1, so it matched 0 entries — the
      # baseline was inert.
      #
      # NOTE: unlike mcp-go, the gate here was still enforcing. nox-strict above
      # bypasses the `baselined -eq 0` report-only branch, so any crit/high would
      # have failed the build regardless; it passes because there genuinely are
      # none. What was broken was the waiver list, not the gate.

  # The Postgres adapter, exercised against Postgres.
  #
  # The shared go-ci workflow runs `go test ./...` with no database, and every
  # pgstore test skips itself when TEST_DATABASE_URL is unset. The package still
  # prints "ok", so the job was green while the adapter production uses was
  # never executed at all.
  #
  # That is not hypothetical. RecordFailureAtomically failed on its first call
  # with SQLSTATE 42804 for as long as it has existed: `CASE WHEN … THEN $4 ELSE
  # NULL END` has two untyped branches, so Postgres resolved it as text and
  # refused to write a timestamptz. memory and sqlite had tests for that method
  # and passed — sqlite is dynamically typed — so the only adapter that could
  # fail was the only adapter without a test. Account lockout was inert for
  # every pgstore consumer, and a failure count that never rises is
  # indistinguishable from an account nobody is attacking.
  pgstore:
    name: Postgres adapter
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: authgo
          POSTGRES_PASSWORD: authgo
          POSTGRES_DB: authgo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://authgo:authgo@127.0.0.1:5432/authgo_test?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test the Postgres adapter
        run: go test ./adapters/pgstore/... -count=1 -race

      # Proves those tests executed rather than skipped.
      #
      # Without this the job can regress to exactly the state it exists to fix:
      # a renamed variable or a dropped service block turns every test into a
      # skip, and the summary still says ok. Asserting on verbose output makes
      # the regression loud instead of invisible.
      - name: Assert the Postgres tests really ran
        run: |
          set -euo pipefail
          go test ./adapters/pgstore/... -count=1 -v | tee /tmp/pgstore.log
          if grep -q -- '--- SKIP' /tmp/pgstore.log; then
            echo "::error::pgstore tests skipped; the adapter production uses was not exercised"
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestLoginAttemptRepo_RecordFailureAtomically' /tmp/pgstore.log; then
            echo "::error::the lockout test did not run"
            exit 1
          fi

