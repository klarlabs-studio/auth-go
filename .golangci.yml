version: "2"

run:
  timeout: 5m

linters:
  default: standard
	enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic
    - gocyclo
    - dupl
    - gosec
  exclusions:
    rules:
      # Preset chains intentionally share structure (CB -> Retry -> Timeout)
      # across HTTPClient / DatabaseQuery / RPCDownstream. Tuning differs;
      # extracting a shared helper would obscure each preset's intent.
      - path: middleware/presets\.go
        linters:
          - dupl
      # Test helpers and fixtures trip entropy/credential heuristics.
      - path: _test\.go
        linters:
          - gosec
      # RFC 6238 mandates HMAC-SHA1 for TOTP; authenticator apps require it.
      - path: domain/totp\.go
        text: "G401|G505|sha1"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
