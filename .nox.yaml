scan:
  exclude:
    # This config itself: the exclusion comments below name secret rules
    # ("...API Key") by design, which trip those very regexes. Not code.
    - ".nox.yaml"
    # Baseline file: contains high-entropy fingerprint hashes (SHA-256 hex)
    # that match the SEC-680 "Prometheus API key" regex; these ARE the
    # finding fingerprints, not actual secrets.
    - ".nox/baseline.json"
    # go.sum: module digests look like API keys to entropy-based detectors.
    - "go.sum"
    - "**/go.sum"
    # CI workflows: pinned commit SHAs + GITHUB_TOKEN references look like
    # secret patterns to entropy-based rules.
    - ".github/workflows/*.yml"
    # Documentation contains example code snippets and curl commands with
    # placeholder tokens / API keys.
    - "README.md"
    - "CHANGELOG.md"
    - "docs/*.md"
    - "**/README.md"
    # Generated coverage badge.
    - "assets/coverage-badge.svg"
    # Grafana dashboard JSON contains Prometheus query expressions that
    # match SEC-680 against `prometheus_*_total` metric names.
    - "assets/grafana/*.json"
    # Generated artifacts.
    - "nox-out/"
    - "release-artifacts/"
    # Parameterized SQL schema (DDL), not application code.
    - "adapters/pgstore/schema.sql"
    # Runnable example programs: living documentation that, like the README
    # snippets above, contains illustrative placeholder data (e.g. a
    # user@example.com email, demo worker IDs). These are documentation values,
    # not real PII or secrets. Mirrors the README/docs exclusions.
    - "example/**"
    # Test files: long CamelCase test-function identifiers (e.g.
    # TestWorkloadKeyService_RejectsExpiredOnIssueIsImmediate) match the
    # SEC-659 "Split API Key" regex. These are identifiers, not secrets —
    # no real key is suppressed. Mirrors the gosec *_test.go exclusion and
    # the convention in the other Klarlabs repos' .nox.yaml.
    - "*_test.go"
    - "**/*_test.go"

# Activate nox code-level taint SAST (source-to-sink: SSRF, injection,
# path traversal). nox scan auto-installs (cosign-verified) + runs it.
plugins:
  required:
    - nox/taint-analysis
