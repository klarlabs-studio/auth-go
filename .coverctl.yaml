version: 1

policy:
  default:
    min: 75
  domains:
    # Core auth domain — entities, value objects, services. High bar.
    - name: domain
      match:
        - ./domain/...
      min: 80
    # In-memory adapters — fully unit-tested.
    - name: memory
      match:
        - ./adapters/memory/...
      min: 85
    # SQLite adapter — embedded, so it is fully unit-tested without an external
    # service (table-driven CRUD + workload key flows + expiry/rotation, plus
    # I/O and decode error paths). Same bar as the other unit-tested adapters.
    - name: sqlite
      match:
        - ./adapters/sqlite/...
      min: 85
    # WebAuthn adapter — ceremonies need a real browser/authenticator; only
    # wiring + option generation is unit-testable.
    - name: webauthn
      match:
        - ./adapters/webauthn/...
      min: 10
    # Postgres adapter — integration-gated on TEST_DATABASE_URL; skips without
    # a database service, so CI coverage is the compile-time port assertions.
    - name: pgstore
      match:
        - ./adapters/pgstore/...
      min: 0
    # Runnable example programs — living documentation exercised via `go run`,
    # not unit-tested. They compile in CI (go build ./...); no coverage bar.
    - name: example
      match:
        - ./example/...
      min: 0
